
<header class="market-header">
<div class="market-top">        <a class="brand" href="/inicio" aria-label="Distans: inicio">
            <div class="brand-mark" aria-hidden="true">
                <svg width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="8" y="18" width="30" height="30" rx="4" fill="#F3FAFF" stroke="#4AA3DF" stroke-width="2"/>
                    <path d="M12 24H34" stroke="#4AA3DF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M14 30H32" stroke="#4AA3DF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M18 18L18 14C18 11.8 19.8 10 22 10H24C26.2 10 28 11.8 28 14V18" stroke="#4AA3DF" stroke-width="2"/>
                    <circle cx="24" cy="42" r="3" fill="#4AA3DF"/>
                    <path d="M24 52C24 52 33 43.9 33 37.1C33 32.1 29 28 24 28C19 28 15 32.1 15 37.1C15 43.9 24 52 24 52Z" fill="#F3FAFF" stroke="#F0A43A" stroke-width="2"/>
                    <circle cx="24" cy="37" r="2.6" fill="#4AA3DF"/>
                </svg>
            </div>
            <span class="brand-name">DISTANS</span>
        </a>


<div class="market-location-controls">
{% if es_inicio %}<button type="button" class="location-button" id="selectLocation">Seleccionar ubicación</button>
<label class="radius-control"><span class="sr-only">Radio de búsqueda</span><select id="searchRadius"><option value="0">Radio</option><option value="500">500 m</option><option value="1000">1 km</option><option value="2000">2 km</option><option value="5000">5 km</option><option value="10000">10 km</option></select></label>{% else %}<a class="location-button location-link" href="/inicio?tab=mapa">Buscar por ubicación y radio</a>{% endif %}
</div>
<div class="market-account">{% if user_name %}<a class="account-button" href="/usuarios/cuenta" aria-label="Mi cuenta de {{ user_name }}">Mi cuenta</a>{% if es_admin %}<a class="account-button" href="/admin/usuarios/panel">Usuarios</a>{% endif %}<button class="account-button" type="button" onclick="cerrarSesion()">Cerrar sesión</button>{% else %}<a class="account-button" href="/registro">Registrarse</a><a class="account-button" href="/login">Iniciar sesión</a>{% endif %}
<a class="market-icon" href="/usuarios/cuenta" aria-label="Mi cuenta"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="16" cy="9" r="4"/><path d="M6 28c0-12 20-12 20 0"/></svg></a>
<a class="market-icon cart-icon" href="/carrito" aria-label="Carrito"><svg viewBox="0 0 40 36" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 2l8 3 5 22h18l6-19H10M14 14h22M16 21h18M20 8l2 18M30 8l-2 18"/><circle cx="17" cy="32" r="2"/><circle cx="31" cy="32" r="2"/></svg></a></div>
</div>
        <form class="search-form" action="/inicio" method="get" role="search">
            <div><label for="headerBusqueda">¿Qué buscas?</label><input id="headerBusqueda" name="q" value="{{ q if es_inicio else '' }}" maxlength="120" placeholder="Producto, marca o tienda"></div>
            <div><label for="headerCategoria">Categoría</label><select id="headerCategoria" name="categoria"><option value="">Todas las categorías</option>{% for categoria in categorias %}<option value="{{ categoria.value }}" {% if es_inicio and categoria.value == categoria_seleccionada %}selected{% endif %}>{{ categoria.value }}</option>{% endfor %}</select></div>
            <label class="featured-filter"><input type="checkbox" name="destacados" value="true" {% if es_inicio and destacados %}checked{% endif %}> Solo destacados</label>
            <button type="submit" class="search-button">Buscar</button>
            <a class="clear-filters" href="/inicio?q=&amp;tab=productos">Quitar filtros</a>
{% if es_inicio %}
            <input type="hidden" name="latitud" data-geo="latitud" {% if latitud is not none %}value="{{ latitud }}"{% else %}disabled{% endif %}>
            <input type="hidden" name="longitud" data-geo="longitud" {% if longitud is not none %}value="{{ longitud }}"{% else %}disabled{% endif %}>
            <input type="hidden" name="radio" data-geo="radio" value="{{ radio }}">
        {% endif %}
</form>
<nav class="market-tabs" aria-label="Navegación de compras"><a href="/inicio?tab=mapa" data-tab="mapa">MAPA</a><a href="/inicio?q=&amp;tab=productos" data-tab="productos">CATÁLOGO</a><a href="/inicio?tab=tiendas" data-tab="tiendas">TIENDAS</a></nav>
</header>
