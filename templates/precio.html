<p class="product-price">{% if producto.precio_oferta is not none %}<span aria-label="Precio en oferta">{{ '%.2f'|format(producto.precio_oferta) }} €</span> <del aria-label="Precio normal">{{ '%.2f'|format(producto.precio) }} €</del> <span class="offer-badge">Oferta · {{ '%g'|format(producto.descuento) }} % de descuento</span>{% else %}{{ '%.2f'|format(producto.precio) }} €{% endif %}</p>
